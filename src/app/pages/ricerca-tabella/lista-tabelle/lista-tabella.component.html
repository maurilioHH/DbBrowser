<div class="container py-2 px-0">
    <div class="table-container">
        @if(listaTabelle()!.length > 0){
            <table class="table table-striped custom-table">
                <thead>
                    <tr>
                        <th scope="col">Url</th>
                        <th scope="col">User</th>
                        <th scope="col">Owner</th>
                        <th scope="col">Nome</th>
                        <th scope="col"></th>
                    </tr>
                </thead>
                <tbody>
                    @for (table of listaTabelle(); track $index) {
                        <tr>
                            <td>{{ table.url }}</td>
                            <td>{{ table.user }}</td>
                            <td>{{ table.owner }}</td>
                            <td>{{ table.tableName }}</td>
                            <td>
                            <i class="fa-solid fa-magnifying-glass pointer" (click)="onSelectTable(table)"></i>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        }    
        @else{
            <p class="text-center text-danger">Nessun risultato trovato</p>
        }
    </div>
</div>
