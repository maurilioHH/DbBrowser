<div class="container-fluid py-2 px-0">
    <div class="table-container">
        @if(listaTabelle()!.length > 0){
            <table class="table table-striped custom-table">
                <thead>
                    <tr>
                        <th scope="col">Url</th>
                        <th scope="col">User</th>
                        <th scope="col">Schema</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Tipologia</th>
                        <th scope="col"></th>
                    </tr>
                </thead>
                <tbody>
                    @for (tableView of listaTabelle(); track $index) {
                        <tr>
                            <td><span class="ms-2">{{ tableView.url }}</span></td>
                            <td>{{ tableView.user }}</td>
                            <td>{{ tableView.owner }}</td>
                            <td>{{ tableView.name }}</td>
                            <td>{{ tableView.type === 'T' ? 'Tabella' : 'Vista' }}</td>
                            <td>
                                <span class="me-2">
                                    <i class="fa-solid fa-magnifying-glass pointer" 
                                    (click)="onSelectTable(tableView)">
                                    </i>
                                </span>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        }    
        @else{
            <p class="text-center text-danger">Nessun risultato trovato</p>
        }
    </div>
</div>
