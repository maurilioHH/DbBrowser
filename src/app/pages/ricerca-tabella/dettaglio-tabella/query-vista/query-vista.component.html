<div ngbAccordion>
    <div ngbAccordionItem [collapsed]="true">
        <h2 ngbAccordionHeader>
            <button ngbAccordionButton>Query</button>
        </h2>
        <div ngbAccordionCollapse>
            <div ngbAccordionBody>
                <ng-template>
                    <pre>{{ queryText() }}</pre>
                </ng-template>
            </div>
        </div>
    </div>
</div>
